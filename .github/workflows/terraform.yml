# Plan/apply manual por stack. Requiere: secret GCP_TERRAFORM_SA_KEY, var TF_STATE_BUCKET,
# y secret TF_STACK_TFVARS (contenido multilínea del terraform.tfvars del stack).
name: Terraform infra

on:
  workflow_dispatch:
    inputs:
      stack:
        description: "Stack Terraform"
        type: choice
        required: true
        options:
          - dev
          - qa
          - prd
      terraform_action:
        description: "Acción"
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  terraform:
    name: Terraform (${{ inputs.stack }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform/environments/${{ inputs.stack }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Comprobar TF_STATE_BUCKET
        run: |
          if [[ -z "${{ vars.TF_STATE_BUCKET }}" ]]; then
            echo "::error::Define la variable de repositorio TF_STATE_BUCKET."
            exit 1
          fi

      - name: Escribir terraform.tfvars desde secret
        env:
          TFVARS_CONTENT: ${{ secrets.TF_STACK_TFVARS }}
        run: |
          if [[ -z "${TFVARS_CONTENT:-}" ]]; then
            echo "::error::Define el secret TF_STACK_TFVARS con el contenido de terraform.tfvars (billing_account_id, folder_id u org_id)."
            exit 1
          fi
          printf '%s\n' "${TFVARS_CONTENT}" > terraform.tfvars

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_TERRAFORM_SA_KEY }}

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=terraform/env/${{ inputs.stack }}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: inputs.terraform_action == 'plan'
        run: terraform plan -no-color -input=false

      - name: Terraform apply
        if: inputs.terraform_action == 'apply'
        run: terraform apply -auto-approve -no-color -input=false
